
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام حسابات الموظفين</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#164e63)}.card{background:white;border-radius:24px;box-shadow:0 20px 60px #0002;padding:28px}.login .card{width:min(420px,92vw)}h1,h2,h3{margin-top:0}.brand{font-size:28px;font-weight:900}.muted{color:#64748b}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dbe3ee;border-radius:12px;background:#fff}.btn{padding:11px 16px;border-radius:12px;font-weight:800;background:#0f766e;color:#fff}.btn.secondary{background:#e2e8f0;color:#172033}.btn.danger{background:#dc2626}.btn.blue{background:#2563eb}.app{display:none;min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}.side{background:#0f172a;color:white;padding:20px}.side button{width:100%;text-align:right;background:transparent;color:#cbd5e1;padding:13px;border-radius:10px;margin-bottom:5px}.side button.active,.side button:hover{background:#1e293b;color:white}.main{padding:24px;max-width:1400px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{padding:20px;border-radius:18px;background:#fff;border:1px solid #e8edf4}.stat .num{font-size:26px;font-weight:900;margin-top:8px}.section{margin-top:20px}.tablewrap{overflow:auto;background:#fff;border-radius:18px;border:1px solid #e5e7eb}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}.table th{background:#f8fafc}.pill{padding:5px 9px;border-radius:999px;background:#e2e8f0;font-size:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:20}.modal .card{width:min(560px,94vw);max-height:90vh;overflow:auto}.toast{position:fixed;bottom:20px;left:20px;background:#111827;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:30}.money{font-weight:900}.positive{color:#15803d}.negative{color:#b91c1c}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:6px}.side button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.main{padding:14px}.top{padding:0 14px}.hide-sm{display:none}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="brand">💼 حسابات الموظفين</div><p class="muted">دخول آمن للمشرف والموظفين</p><form id="loginForm"><div class="field"><label>اسم المستخدم</label><input id="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn" style="width:100%">دخول</button></form><p id="loginErr" class="bad" style="display:none;padding:10px;border-radius:10px"></p></div></div>
<div id="app" class="app"><header class="top"><div><b>💼 حسابات الموظفين</b> <span id="who" class="muted"></span></div><button class="btn secondary" onclick="logout()">تسجيل الخروج</button></header><div class="layout"><aside class="side" id="nav"></aside><main class="main" id="content"></main></div></div>
<div id="modal" class="modal"><div class="card"><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let me=null, employees=[];const money=n=>new Intl.NumberFormat('ar-PS',{maximumFractionDigits:2}).format(Number(n)||0)+' ₪';const month=()=>new Date().toISOString().slice(0,7);function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.error||'حدث خطأ')}return r.json()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});me=x.user;await start()}catch(e){$('#loginErr').textContent=e.message;$('#loginErr').style.display='block'}};
async function start(){employees=await api('/api/employees');$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent='— '+(me.role==='admin'?'مشرف':employees[0]?.name);buildNav();dashboard()}
function buildNav(){let n=[['dashboard','الرئيسية'],['account','حسابي'],['attendance','الحضور والدوام'],['myexpenses','مصاريفي']];if(me.role==='admin')n.push(['employees','الموظفون'],['expenses','كل المصاريف'],['report','التقرير الشهري']);$('#nav').innerHTML=n.map((x,i)=>`<button id="nav-${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function active(id){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));$('#nav-'+id)?.classList.add('active')}async function go(id){active(id);if(id==='dashboard')dashboard();if(id==='account')account();if(id==='attendance')attendance();if(id==='myexpenses')myExpenses();if(id==='employees')employeesPage();if(id==='expenses')expenses();if(id==='report')report()}
async function dashboard(){const r=await api('/api/report?month='+month());const all=r.employees;const salary=all.reduce((s,e)=>s+e.salary,0),received=all.reduce((s,e)=>s+e.received,0);$('#content').innerHTML=`<h1>لوحة التحكم</h1><p class="muted">ملخص شهر ${r.month}</p><div class="grid"><div class="stat">الرواتب <div class="num">${money(salary)}</div></div><div class="stat">المستلم <div class="num positive">${money(received)}</div></div><div class="stat">المتبقي <div class="num negative">${money(salary-received)}</div></div><div class="stat">الموظفون <div class="num">${all.length}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>الموظف</th><th>الراتب</th><th>استلم</th><th>المتبقي</th><th>الحضور</th></tr>${all.map(e=>`<tr><td>${e.name}</td><td>${money(e.salary)}</td><td>${money(e.received)}</td><td class="money ${e.balance<0?'negative':'positive'}">${money(e.balance)}</td><td>${e.days} يوم / ${e.hours} ساعة</td></tr>`).join('')}</table></div>`}
async function account(){const e=employees[0];const r=await api('/api/report?month='+month());const x=r.employees.find(a=>a.id===e.id);$('#content').innerHTML=`<div class="toolbar"><div><h1>حسابي</h1><p class="muted">${x.name} — ${x.group} — شهر ${r.month}</p></div><button class="btn" onclick="addPayment()">➕ إضافة مبلغ استلمته</button></div><div class="grid"><div class="stat">الراتب <div class="num">${money(x.salary)}</div></div><div class="stat">استلمت هذا الشهر <div class="num positive">${money(x.received)}</div></div><div class="stat">المتبقي <div class="num negative">${money(x.balance)}</div></div><div class="stat">ساعات العمل <div class="num">${x.hours}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>التاريخ</th><th>المبلغ</th><th>النوع</th><th>البيان</th><th>أضافها</th></tr>${x.payments.map(p=>`<tr><td>${p.date}</td><td class="money">${money(p.amount)}</td><td>${p.type}</td><td>${p.note||'-'}</td><td>${p.added_by}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد دفعات بعد</td></tr>'}</table></div>`}
async function addPayment(empId=null){const e=empId?employees.find(x=>x.id===empId):employees[0];$('#modalBody').innerHTML=`<h2>إضافة مبلغ مستلم</h2><p class="muted">${e.name}</p>${me.role==='admin'?`<div class="field"><label>الموظف</label><select id="pemp">${employees.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${x.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>المبلغ</label><input id="pamount" type="number" min="0.01" step="0.01"></div><div class="field"><label>التاريخ</label><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>النوع</label><select id="ptype"><option>دفعة</option><option>راتب</option><option>سلفة</option><option>مكافأة</option></select></div><div class="field"><label>البيان</label><textarea id="pnote"></textarea></div><div class="toolbar"><button class="btn" onclick="savePayment()">حفظ</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`;openModal()}
async function savePayment(){try{await api('/api/payments',{method:'POST',body:JSON.stringify({employee_id:me.role==='admin'?Number($('#pemp').value):employees[0].id,amount:Number($('#pamount').value),date:$('#pdate').value,type:$('#ptype').value,note:$('#pnote').value})});closeModal();toast('تم حفظ المبلغ');go(me.role==='admin'?'dashboard':'account')}catch(e){toast(e.message)}}
async function attendance(){const id=employees[0].id;const rows=await api('/api/attendance?employee_id='+id+'&month='+month());$('#content').innerHTML=`<div class="toolbar"><div><h1>الحضور والدوام</h1><p class="muted">شهر ${month()}</p></div><button class="btn" onclick="addAttendance()">➕ تسجيل يوم</button></div><div class="section tablewrap"><table class="table"><tr><th>التاريخ</th><th>الحالة</th><th>الساعات</th><th>البيان</th></tr>${rows.map(a=>`<tr><td>${a.date}</td><td><span class="pill ${a.status==='حضور'?'ok':'bad'}">${a.status}</span></td><td>${a.hours}</td><td>${a.note||'-'}</td></tr>`).join('')||'<tr><td colspan="4">لا يوجد سجل</td></tr>'}</table></div>`}
async function addAttendance(){const e=employees[0];$('#modalBody').innerHTML=`<h2>تسجيل دوام</h2><div class="field"><label>التاريخ</label><input id="adate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>الحالة</label><select id="ast"><option>حضور</option><option>غياب</option><option>إجازة</option></select></div><div class="field"><label>الساعات</label><input id="ah" type="number" min="0" step="0.5" value="8"></div><div class="field"><label>ملاحظة</label><textarea id="an"></textarea></div><button class="btn" onclick="saveAttendance()">حفظ</button> <button class="btn secondary" onclick="closeModal()">إلغاء</button>`;openModal()}async function saveAttendance(){try{await api('/api/attendance',{method:'POST',body:JSON.stringify({employee_id:employees[0].id,date:$('#adate').value,status:$('#ast').value,hours:Number($('#ah').value),note:$('#an').value})});closeModal();attendance();toast('تم تسجيل الدوام')}catch(e){toast(e.message)}}
async function employeesPage(){const es=await api('/api/employees');$('#content').innerHTML=`<div class="toolbar"><div><h1>إدارة الموظفين</h1><p class="muted">تعديل الراتب والمجموعة والبيانات</p></div></div><div class="section tablewrap"><table class="table"><tr><th>الموظف</th><th>المستخدم</th><th>المجموعة</th><th>الراتب</th><th>الحساب</th><th></th></tr>${es.map(e=>`<tr><td>${e.name}</td><td>${e.username}</td><td>${e.group}</td><td>${money(e.salary)}</td><td><button class="btn" onclick="adminAccount(${e.id})">فتح الحساب</button></td><td><button class="btn blue" onclick="editEmployee(${e.id})">تعديل</button></td></tr>`).join('')}</table></div>`}
async function adminAccount(id){const r=await api('/api/report?month='+month());const x=r.employees.find(e=>e.id===id);$('#content').innerHTML=`<div class="toolbar"><div><h1>حساب ${x.name}</h1><p class="muted">${x.group} — ${month()}</p></div><button class="btn" onclick="addPayment(${x.id})">➕ إضافة دفعة</button><button class="btn secondary" onclick="employeesPage()">رجوع</button></div><div class="grid"><div class="stat">الراتب<div class="num">${money(x.salary)}</div></div><div class="stat">استلم<div class="num positive">${money(x.received)}</div></div><div class="stat">المتبقي<div class="num negative">${money(x.balance)}</div></div><div class="stat">ساعات<div class="num">${x.hours}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>التاريخ</th><th>المبلغ</th><th>النوع</th><th>البيان</th><th></th></tr>${x.payments.map(p=>`<tr><td>${p.date}</td><td>${money(p.amount)}</td><td>${p.type}</td><td>${p.note||'-'}</td><td><button class="btn blue" onclick='editPayment(${JSON.stringify(p)})'>تعديل</button> <button class="btn danger" onclick="deletePayment(${p.id},${x.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد دفعات</td></tr>'}</table></div>`}
async function editEmployee(id){const e=employees.find(x=>x.id===id);$('#modalBody').innerHTML=`<h2>تعديل ${e.name}</h2><div class="field"><label>الاسم</label><input id="en" value="${e.name}"></div><div class="field"><label>المجموعة</label><input id="eg" value="${e.group}"></div><div class="field"><label>الراتب الشهري</label><input id="es" type="number" value="${e.salary}"></div><button class="btn" onclick="saveEmployee(${id})">حفظ التعديل</button> <button class="btn secondary" onclick="closeModal()">إلغاء</button>`;openModal()}async function saveEmployee(id){await api('/api/employees/'+id,{method:'PUT',body:JSON.stringify({name:$('#en').value,group:$('#eg').value,salary:Number($('#es').value)})});closeModal();employees=await api('/api/employees');employeesPage();toast('تم تعديل حساب الموظف')}
async function editPayment(p){$('#modalBody').innerHTML=`<h2>تعديل الدفعة</h2><div class="field"><label>المبلغ</label><input id="epamount" type="number" value="${p.amount}"></div><div class="field"><label>التاريخ</label><input id="epdate" type="date" value="${p.date}"></div><div class="field"><label>النوع</label><input id="eptype" value="${p.type}"></div><div class="field"><label>البيان</label><textarea id="epnote">${p.note||''}</textarea></div><button class="btn" onclick="saveEditPayment(${p.id},${p.employee_id})">حفظ</button> <button class="btn secondary" onclick="closeModal()">إلغاء</button>`;openModal()}async function saveEditPayment(id,eid){await api('/api/payments/'+id,{method:'PUT',body:JSON.stringify({amount:Number($('#epamount').value),date:$('#epdate').value,type:$('#eptype').value,note:$('#epnote').value})});closeModal();adminAccount(eid);toast('تم تعديل الدفعة')}async function deletePayment(id,eid){if(!confirm('حذف الدفعة؟'))return;await api('/api/payments/'+id,{method:'DELETE'});adminAccount(eid);toast('تم حذف الدفعة')}
async function expenses(){const r=await api('/api/expenses?month='+month());const total=r.reduce((s,x)=>s+x.amount,0);const by={};r.forEach(x=>{by[x.employee_id]=(by[x.employee_id]||0)+x.amount});$('#content').innerHTML=`<div class="toolbar"><div><h1>كل المصاريف</h1><p class="muted">مصاريف جميع الموظفين — شهر ${month()}</p></div><button class="btn" onclick="addExpense()">➕ إضافة مصروف</button></div><div class="grid"><div class="stat">إجمالي مصاريف الشهر <div class="num negative">${money(total)}</div></div>${employees.map(e=>`<div class="stat">${e.name}<div class="num">${money(by[e.id]||0)}</div></div>`).join('')}</div><div class="section tablewrap"><table class="table"><tr><th>الموظف</th><th>التاريخ</th><th>المبلغ</th><th>التصنيف</th><th>البيان</th><th>أضافها</th><th></th></tr>${r.map(x=>`<tr><td>${employees.find(e=>e.id===x.employee_id)?.name||'-'}</td><td>${x.date}</td><td>${money(x.amount)}</td><td>${x.category}</td><td>${x.note||'-'}</td><td>${x.added_by||'-'}</td><td><button class="btn blue" onclick='editExpense(${JSON.stringify(x)})'>تعديل</button> <button class="btn danger" onclick="deleteExpense(${x.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد مصاريف لهذا الشهر</td></tr>'}</table></div>`}
async function myExpenses(){const r=await api('/api/expenses?month='+month());const total=r.reduce((s,x)=>s+x.amount,0);$('#content').innerHTML=`<div class="toolbar"><div><h1>مصاريفي الشهرية</h1><p class="muted">سجّل مصاريفك الخاصة بهذا الشهر، وستظهر مباشرة عند المشرف.</p></div><button class="btn" onclick="addExpense()">➕ إضافة مصروف</button></div><div class="grid"><div class="stat">إجمالي مصاريفي <div class="num negative">${money(total)}</div></div><div class="stat">عدد المصاريف <div class="num">${r.length}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>التاريخ</th><th>المبلغ</th><th>التصنيف</th><th>البيان</th><th>أضافها</th></tr>${r.map(x=>`<tr><td>${x.date}</td><td>${money(x.amount)}</td><td>${x.category}</td><td>${x.note||'-'}</td><td>${x.added_by||me.username}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد مصاريف لهذا الشهر</td></tr>'}</table></div>`}
async function addExpense(){const isAdmin=me.role==='admin';$('#modalBody').innerHTML=`<h2>إضافة مصروف شهري</h2>${isAdmin?`<div class="field"><label>الموظف</label><select id="xemp">${employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>المبلغ</label><input id="xamount" type="number" min="0"></div><div class="field"><label>التاريخ</label><input id="xdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>التصنيف</label><input id="xcat" value="عام"></div><div class="field"><label>البيان</label><textarea id="xnote" placeholder="مثال: مواصلات، طعام، أدوات عمل..."></textarea></div><button class="btn" onclick="saveExpense()">حفظ المصروف</button> <button class="btn secondary" onclick="closeModal()">إلغاء</button>`;openModal()}
async function saveExpense(){const body={amount:Number($('#xamount').value),date:$('#xdate').value,category:$('#xcat').value,note:$('#xnote').value};if(me.role==='admin')body.employee_id=Number($('#xemp').value);await api('/api/expenses',{method:'POST',body:JSON.stringify(body)});closeModal();me.role==='admin'?expenses():myExpenses();toast('تم حفظ المصروف')}
async function editExpense(x){$('#modalBody').innerHTML=`<h2>تعديل المصروف</h2><div class="field"><label>الموظف</label><select id="eexemp">${employees.map(e=>`<option value="${e.id}" ${e.id===x.employee_id?'selected':''}>${e.name}</option>`).join('')}</select></div><div class="field"><label>المبلغ</label><input id="eexamount" type="number" value="${x.amount}"></div><div class="field"><label>التاريخ</label><input id="eexdate" type="date" value="${x.date}"></div><div class="field"><label>التصنيف</label><input id="eexcat" value="${x.category||''}"></div><div class="field"><label>البيان</label><textarea id="eexnote">${x.note||''}</textarea></div><button class="btn" onclick="saveEditExpense(${x.id})">حفظ</button> <button class="btn secondary" onclick="closeModal()">إلغاء</button>`;openModal()}
async function saveEditExpense(id){await api('/api/expenses/'+id,{method:'PUT',body:JSON.stringify({employee_id:Number($('#eexemp').value),amount:Number($('#eexamount').value),date:$('#eexdate').value,category:$('#eexcat').value,note:$('#eexnote').value})});closeModal();expenses();toast('تم تعديل المصروف')}
async function deleteExpense(id){if(!confirm('حذف المصروف؟'))return;await api('/api/expenses/'+id,{method:'DELETE'});expenses()}
async function report(){const r=await api('/api/report?month='+month());$('#content').innerHTML=`<div class="toolbar"><div><h1>التقرير الشهري</h1><p class="muted">${r.month}</p></div><button class="btn" onclick="downloadBackup()">نسخة احتياطية</button></div><div class="grid"><div class="stat">إجمالي مصاريف الشهر <div class="num negative">${money(r.expenses.reduce((s,x)=>s+x.amount,0))}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>الموظف</th><th>الراتب</th><th>استلم</th><th>المتبقي</th><th>مصاريف</th><th>حضور</th><th>غياب</th><th>ساعات</th></tr>${r.employees.map(e=>`<tr><td>${e.name}</td><td>${money(e.salary)}</td><td>${money(e.received)}</td><td>${money(e.balance)}</td><td>${money(e.expense_total||0)}</td><td>${e.days}</td><td>${e.absences}</td><td>${e.hours}</td></tr>`).join('')}</table></div>`}async function settings(){
  const adminUsers=me.role==='admin'?await api('/api/admin/users'):[];
  $('#content').innerHTML=`<div class="toolbar"><div><h1>الإعدادات والحساب</h1><p class="muted">غيّر كلمة السر الخاصة بحسابك بأمان.</p></div></div><div class="section" style="max-width:650px"><h2>تغيير كلمة سري</h2><div class="field"><label>كلمة السر الحالية</label><input id="cpcurrent" type="password" autocomplete="current-password"></div><div class="field"><label>كلمة السر الجديدة</label><input id="cpnew" type="password" autocomplete="new-password"></div><div class="field"><label>تأكيد كلمة السر الجديدة</label><input id="cpconfirm" type="password" autocomplete="new-password"></div><button class="btn" onclick="changeMyPassword()">حفظ كلمة السر</button></div>${me.role==='admin'?`<div class="section"><h2>إعادة تعيين كلمات سر الموظفين</h2><p class="muted">الـAdmin يستطيع تعيين كلمة سر جديدة لأي مستخدم.</p><div class="tablewrap"><table class="table"><tr><th>المستخدم</th><th>الدور</th><th>كلمة السر الجديدة</th><th></th></tr>${adminUsers.map(u=>`<tr><td>${u.username}</td><td>${u.role==='admin'?'مشرف':'موظف'}</td><td><input id="adminpw${u.id}" type="password" placeholder="6 أحرف على الأقل"></td><td><button class="btn blue" onclick="adminResetPassword(${u.id})">تغيير</button></td></tr>`).join('')}</table></div></div>`:''}`;
}
async function changeMyPassword(){const a=$('#cpcurrent').value,b=$('#cpnew').value,c=$('#cpconfirm').value;if(b!==c)return toast('كلمتا السر الجديدتان غير متطابقتين');try{await api('/api/password/change',{method:'POST',body:JSON.stringify({currentPassword:a,newPassword:b})});$('#cpcurrent').value='';$('#cpnew').value='';$('#cpconfirm').value='';toast('تم تغيير كلمة السر بنجاح')}catch(e){toast(e.message)}}
async function adminResetPassword(id){const v=$('#adminpw'+id).value;if(!v)return toast('اكتب كلمة السر الجديدة');try{await api('/api/admin/password/'+id,{method:'POST',body:JSON.stringify({newPassword:v})});$('#adminpw'+id).value='';toast('تم تغيير كلمة السر بنجاح')}catch(e){toast(e.message)}}
function downloadBackup(){location.href='/api/backup'}function openModal(){$('#modal').style.display='grid'}function closeModal(){$('#modal').style.display='none'}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}(async()=>{try{const x=await api('/api/me');me=x.user;await start()}catch{}})();
</script></body></html>
